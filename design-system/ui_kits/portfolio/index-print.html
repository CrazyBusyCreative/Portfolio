<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>tballad.me — UI Kit (print)</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  /* Print page setup */
  @page { size: A4 portrait; margin: 14mm 12mm; }

  body { background: #fff; }

  /* Tile each page section: each top-level "view" prints starting on a new page */
  .print-page {
    break-before: page;
    break-inside: auto;
    padding-top: 4mm;
  }
  .print-page:first-child { break-before: auto; }

  /* Section header strip above each printed page */
  .print-page-header {
    font-family: 'Barlow', system-ui, sans-serif;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #5f5e5a;
    border-bottom: 1px solid rgba(0,0,0,0.12);
    padding-bottom: 4px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
  }

  /* Prevent unwanted breaks within atomic cards */
  .project-card,
  .testimonial-card,
  .work-card,
  .speaking-card,
  .stat-card,
  .timeline-item,
  .principle,
  .award,
  .contact-card,
  .signal,
  .step,
  .convergence-quote,
  .closing-note,
  .lab-block,
  .availability-band,
  .next-section,
  .footer { break-inside: avoid; }

  /* Hide sticky nav in print (we'll show a static header per page) */
  .nav-root, nav.nav { display: none !important; }

  /* Hide the page footer except at very end */
  body > .footer { break-before: page; }

  /* Force backgrounds & colors to print */
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

  /* Shrink hero a touch so it fits one page */
  .hero { padding-top: 32px; padding-bottom: 32px; }

  /* Avoid clipping */
  html, body { overflow: visible !important; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Atoms.jsx"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="HomeView.jsx"></script>
<script type="text/babel" src="ProjectsView.jsx"></script>
<script type="text/babel" src="AboutView.jsx"></script>
<script type="text/babel" src="ContactView.jsx"></script>

<script type="text/babel">
const PrintPage = ({label, children}) => (
  <section className="print-page">
    <div className="print-page-header">
      <span>tballad.me — UI Kit</span>
      <span>{label}</span>
    </div>
    {children}
  </section>
);

const PrintApp = () => (
  <>
    <PrintPage label="Home"><HomeView onNav={() => {}}/></PrintPage>
    <PrintPage label="Projects"><ProjectsView onNav={() => {}}/></PrintPage>
    <PrintPage label="About"><AboutView/></PrintPage>
    <PrintPage label="Contact"><ContactView/></PrintPage>
    <Footer/>
  </>
);

ReactDOM.createRoot(document.getElementById('root')).render(<PrintApp/>);

// Auto-print after fonts + Babel-transformed scripts have settled
(async () => {
  try { await document.fonts.ready; } catch (e) {}
  // Give Babel + React a moment to mount everything
  await new Promise(r => setTimeout(r, 800));
  window.print();
})();
</script>
</body>
</html>
