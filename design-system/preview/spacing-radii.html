<!doctype html><html><head><meta charset="utf-8"><title>Spacing &amp; radii</title><link rel="stylesheet" href="_base.css"></head>
<body><div class="card-root">
  <div class="row" style="gap:18px; align-items:flex-end;">
    <div style="text-align:center;"><div style="width:38px; height:38px; background:#f8f7f4; border:1px solid rgba(0,0,0,0.08); border-radius:6px;"></div><div class="muted" style="font-size:10px; margin-top:4px;">6px · sm</div></div>
    <div style="text-align:center;"><div style="width:54px; height:54px; background:#f8f7f4; border:1px solid rgba(0,0,0,0.08); border-radius:10px;"></div><div class="muted" style="font-size:10px; margin-top:4px;">10px · card</div></div>
    <div style="text-align:center;"><div style="width:80px; height:30px; background:#f8f7f4; border:1px solid rgba(0,0,0,0.08); border-radius:100px;"></div><div class="muted" style="font-size:10px; margin-top:4px;">100px · pill</div></div>
    <div style="text-align:center;"><div style="width:54px; height:54px; background:#f8f7f4; border:1px solid rgba(0,0,0,0.08); border-radius:50%;"></div><div class="muted" style="font-size:10px; margin-top:4px;">50% · circle</div></div>
  </div>
  <div style="display:flex; gap:10px; align-items:center;">
    <div style="width:4px; height:18px; background:#c85a1a;"></div><span class="muted" style="font-size:11px;">space-1 · 4px</span>
    <div style="width:8px; height:18px; background:#c85a1a;"></div><span class="muted" style="font-size:11px;">space-2 · 8px</span>
    <div style="width:16px; height:18px; background:#c85a1a;"></div><span class="muted" style="font-size:11px;">space-4 · 16px</span>
    <div style="width:24px; height:18px; background:#c85a1a;"></div><span class="muted" style="font-size:11px;">space-6 · 24px</span>
    <div style="width:32px; height:18px; background:#c85a1a;"></div><span class="muted" style="font-size:11px;">space-8 · 32px</span>
    <div style="width:80px; height:18px; background:#c85a1a;"></div><span class="muted" style="font-size:11px;">space-20 · 80px</span>
  </div>
</div></body></html>
