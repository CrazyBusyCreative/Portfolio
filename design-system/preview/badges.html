<!doctype html><html><head><meta charset="utf-8"><title>Badges</title><link rel="stylesheet" href="_base.css"></head>
<body><div class="card-root">
  <div class="row" style="gap:12px;">
    <span style="display:inline-block; font-family:Barlow; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; padding:3px 10px; border-radius:6px; background:#1b3a5c; color:#fff;">Production</span>
    <span style="display:inline-block; font-family:Barlow; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; padding:3px 10px; border-radius:6px; background:#c85a1a; color:#fff;">In Progress</span>
    <span style="display:inline-block; font-family:Barlow; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; color:#c85a1a;">TRACK A</span>
    <span style="display:inline-block; border:1px solid #1b3a5c; border-radius:6px; padding:5px 12px; font-family:Barlow; font-size:13px; font-weight:600; color:#1b3a5c;">84 TRS</span>
  </div>
  <div class="muted" style="font-size:11px;">Status badges (filled), eyebrow track labels (plain), and metric callouts (outlined).</div>
</div></body></html>
