<!doctype html><html><head><meta charset="utf-8"><title>Primary colors</title><link rel="stylesheet" href="_base.css"></head>
<body><div class="card-root">
  <div style="display:grid; grid-template-columns: repeat(2,1fr); gap:14px;">

      <div style="background:#1b3a5c; height:80px;"></div>
      <div style="padding:10px 14px; display:flex; justify-content:space-between; align-items:baseline;">
        <div><div style="font-weight:600; font-size:13px; color:#1a1a18;">Navy</div><div class="muted" style="font-size:11px;">--color-navy · headings, brand</div></div>
        <code style="font-size:11px; color:#5f5e5a;">#1B3A5C</code>
      </div>
    </div>
    <div style="border:1px solid rgba(0,0,0,0.08); border-radius:10px; overflow:hidden;">
      <div style="background:#c85a1a; height:80px;"></div>
      <div style="padding:10px 14px; display:flex; justify-content:space-between; align-items:baseline;">
        <div><div style="font-weight:600; font-size:13px; color:#1a1a18;">Orange</div><div class="muted" style="font-size:11px;">--color-orange · CTAs, accents</div></div>
        <code style="font-size:11px; color:#5f5e5a;">#C85A1A</code>
      </div>
    </div>
  </div>
</div></body></html>
