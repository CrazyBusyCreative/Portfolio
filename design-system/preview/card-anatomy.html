<!doctype html><html><head><meta charset="utf-8"><title>Card anatomy</title><link rel="stylesheet" href="_base.css"></head>
<body><div class="card-root">
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px;">
    <div style="background:#fff; border:1px solid rgba(0,0,0,0.08); border-radius:10px; padding:20px;">
      <div style="font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; color:#c85a1a; margin-bottom:8px;">TRACK A</div>
      <div class="display" style="font-size:24px; margin-bottom:10px;">AI Engineer</div>
      <div class="row" style="gap:6px;">
        <span style="font-family:Barlow; font-size:11px; padding:3px 10px; background:#f8f7f4; border:1px solid rgba(0,0,0,0.08); border-radius:100px; color:#5f5e5a;">Python</span>
        <span style="font-family:Barlow; font-size:11px; padding:3px 10px; background:#f8f7f4; border:1px solid rgba(0,0,0,0.08); border-radius:100px; color:#5f5e5a;">FastAPI</span>
        <span style="font-family:Barlow; font-size:11px; padding:3px 10px; background:#f8f7f4; border:1px solid rgba(0,0,0,0.08); border-radius:100px; color:#5f5e5a;">RAG</span>
      </div>
    </div>
    <div style="background:#fff; border:1px solid rgba(0,0,0,0.08); border-left:4px solid #c85a1a; border-radius:10px; padding:20px;">
      <div class="display" style="font-size:22px; margin-bottom:6px;">AI Engineer</div>
      <div style="font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#5f5e5a; margin-top:6px;">WHAT I BUILD</div>
      <div style="font-size:12px; color:#5f5e5a; margin-top:2px;">Production Python/FastAPI backends, LLM pipelines, SwiftUI apps</div>
    </div>
  </div>
  <div class="muted" style="font-size:11px;">Default card vs. accent-left card (used only on Convergence section).</div>
</div></body></html>
