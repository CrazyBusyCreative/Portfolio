<!doctype html><html><head><meta charset="utf-8"><title>Type scale</title><link rel="stylesheet" href="_base.css"></head>
<body><div class="card-root">
  <div style="display:grid; grid-template-columns: 70px 1fr 90px; gap:10px 16px; align-items:baseline; font-size:12px; color:#5f5e5a;">
    <span class="label">h1</span><span class="display" style="font-size:48px; line-height:1.1;">Heading 1</span><span>clamp 2.5–4rem</span>
    <span class="label">h2</span><span class="display" style="font-size:32px; line-height:1.1;">Heading 2</span><span>clamp 1.6–2.2rem</span>
    <span class="label">h3</span><span class="display" style="font-size:22px; line-height:1.1;">Heading 3</span><span>clamp 1.2–1.6rem</span>
    <span class="label">lede</span><span style="font-size:19px; color:#1b3a5c;">Lead paragraph</span><span>1.2rem</span>
    <span class="label">body</span><span style="font-size:16px;">Body copy at 16px / 1.6</span><span>1rem</span>
    <span class="label">small</span><span style="font-size:14px; color:#5f5e5a;">Captions and metadata</span><span>0.875rem</span>
    <span class="label">eyebrow</span><span style="font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; color:#5f5e5a;">EYEBROW LABEL</span><span>0.7rem</span>
  </div>
</div></body></html>
